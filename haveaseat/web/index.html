<!DOCTYPE html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          sans-serif;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #b18e72;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .loading-text {
        color: #333;
        font-size: 16px;
        font-weight: 500;
        margin-bottom: 10px;
      }

      .loading-subtext {
        color: #666;
        font-size: 14px;
      }

      .logo {
        width: 200px;
        height: auto;
        margin-bottom: 30px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .hidden {
        display: none !important;
      }
    </style>

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="haveaseat" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />

    <title>haveaseat</title>
    <link rel="manifest" href="manifest.json" />
    <!-- 캐시 관련 메타 태그 -->
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Open Graph 메타 태그 수정 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Have A Seat" />
    <meta property="og:title" content="Have A Seat | 공간 관리 플랫폼" />
    <meta
      property="og:description"
      content="당신의 공간을 더 특별하게 만들어드립니다"
    />
    <meta
      property="og:image"
      content="https://hvsconnect.com/preview.png?v=2"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="400" />
    <meta property="og:url" content="https://hvsconnect.com" />

    <!-- 카카오톡 앱 정보 -->
    <meta property="al:web:url" content="https://hvsconnect.com" />

    <script>
      // The value below is injected by flutter build, do not touch.
      const serviceWorkerVersion = null;
    </script>
    <!-- This script adds the flutter initialization JS code -->

    <script src="flutter.js" defer></script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
      function initDaumPostcode(callback) {
        new daum.Postcode({
          oncomplete: function (data) {
            var address = data.address;
            if (data.buildingName !== "") {
              address += " (" + data.buildingName + ")";
            }
            callback(address);
          },
        }).embed();
      }
    </script>
    <script>
      function searchAddress() {
        new daum.Postcode({
          oncomplete: function (data) {
            var address = data.address;
            if (data.buildingName !== "") {
              address += " (" + data.buildingName + ")";
            }

            // Flutter로 데이터 전송
            window.parent.postMessage(
              JSON.stringify({
                type: "address",
                address: address,
              }),
              "*"
            );
          },
        }).open();
      }
    </script>
  </head>
  <body>
    <!-- 로딩 화면 -->
    <div id="loading" class="loading-container">
      <div class="loading-spinner"></div>
    </div>

    <script>
      window.addEventListener("load", function (ev) {
        // Download main.dart.js
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: serviceWorkerVersion,
          },
          onEntrypointLoaded: function (engineInitializer) {
            engineInitializer.initializeEngine().then(function (appRunner) {
              // Flutter 앱이 시작되면 로딩 화면 숨기기
              setTimeout(function () {
                document.getElementById("loading").classList.add("hidden");
              }, 1000);

              appRunner.runApp();
            });
          },
        });
      });
    </script>
  </body>
</html>
